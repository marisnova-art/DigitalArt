<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="robots" content="noindex">
<title>Offline — MarisNova</title>
<link rel="icon" href="/icons/favicon-32.png" type="image/png">
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#18181b;--line:#27272a;--text:#fafafa;--text-2:#a1a1aa;--grad:linear-gradient(90deg,#ff2d55,#f97316)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right))}
.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:36px 28px;text-align:center;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--grad)}
.mark{width:56px;height:56px;border-radius:16px;margin:0 auto 20px;display:block}
h1{font:600 22px/1.3 "Space Grotesk",Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 8px}
p{color:var(--text-2);margin:0 0 24px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button,a.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:24px;padding:11px 22px;font:600 14px/1.2 inherit;border:1px solid transparent;cursor:pointer;text-decoration:none}
.primary{background:#fff;color:#09090b}.primary:hover{background:#fde68a}
.line{background:transparent;color:var(--text);border-color:#3f3f46}.line:hover{background:#27272a}
.status{margin-top:20px;font-size:12px;color:#71717a;display:flex;gap:8px;align-items:center;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#ef4444}
.on .dot{background:#22c55e}
:focus-visible{outline:2px solid #ff2d55;outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.dot{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.35}}}
</style>
</head>
<body>
<main class="card" id="card">
  <img class="mark" src="/icons/icon-192.png" alt="" width="56" height="56">
  <h1 id="t">You're offline</h1>
  <p id="d">MarisNova needs a connection to load new artworks. Previously viewed images are kept on this device.</p>
  <div class="row">
    <button class="primary" id="retry" type="button">Try again</button>
    <a class="btn line" id="home" href="/">Home</a>
  </div>
  <div class="status" id="st" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="sl">No connection</span></div>
</main>
<script>
(function () {
  var lang = 'en';
  try { var s = JSON.parse(localStorage.getItem('mn.lang')); if (s === 'ko' || s === 'en') lang = s; else if ((navigator.language || '').toLowerCase().indexOf('ko') === 0) lang = 'ko'; }
  catch (e) { if ((navigator.language || '').toLowerCase().indexOf('ko') === 0) lang = 'ko'; }
  var T = lang === 'ko'
    ? { t: '오프라인 상태입니다', d: '새 작품을 불러오려면 인터넷 연결이 필요합니다. 이전에 본 이미지는 이 기기에 보관되어 있습니다.', r: '다시 시도', h: '홈', off: '연결 없음', on: '다시 연결됨 — 불러오는 중…' }
    : { t: "You're offline", d: 'MarisNova needs a connection to load new artworks. Previously viewed images are kept on this device.', r: 'Try again', h: 'Home', off: 'No connection', on: 'Back online — loading…' };
  document.documentElement.lang = lang; document.title = (lang === 'ko' ? '오프라인' : 'Offline') + ' — MarisNova';
  document.getElementById('t').textContent = T.t; document.getElementById('d').textContent = T.d;
  document.getElementById('retry').textContent = T.r; document.getElementById('home').textContent = T.h;
  var st = document.getElementById('st'), sl = document.getElementById('sl');
  function go() { location.reload(); }
  function sync() { var on = navigator.onLine; st.classList.toggle('on', on); sl.textContent = on ? T.on : T.off; if (on) setTimeout(go, 800); }
  document.getElementById('retry').onclick = go;
  addEventListener('online', sync); addEventListener('offline', sync);
  sl.textContent = T.off;
})();
</script>
</body>
</html>
